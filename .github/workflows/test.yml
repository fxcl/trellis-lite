name: tests

on:
  push:
    branches: [main]
    paths:
      - "lite/.trellis-lite/scripts/trellis.py"
      - "lite/install.sh"
      - "lite/uninstall.sh"
      - "lite/.trellis-lite/spec/TEMPLATE.md"
      - "lite/tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "lite/.trellis-lite/scripts/trellis.py"
      - "lite/install.sh"
      - "lite/uninstall.sh"
      - "lite/.trellis-lite/spec/TEMPLATE.md"
      - "lite/tests/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Byte-compile trellis.py
        run: |
          python3 -m py_compile lite/.trellis-lite/scripts/trellis.py
          echo "py_compile: OK"

      - name: Install bash + run install.sh smoke test
        run: |
          mkdir -p /tmp/trellis-ci-target
          chmod +x lite/install.sh
          bash lite/install.sh /tmp/trellis-ci-target ci-tester --platforms qoder,claude
          test -f /tmp/trellis-ci-target/.trellis-lite/scripts/trellis.py
          test -f /tmp/trellis-ci-target/AGENTS.md
          test -f /tmp/trellis-ci-target/.clinerules/trellis-lite.md
          echo "install.sh: OK"

      - name: Uninstall.sh smoke test
        run: |
          chmod +x lite/uninstall.sh
          # Refuse when nothing installed (exit code != 0)
          mkdir -p /tmp/trellis-empty
          bash lite/uninstall.sh /tmp/trellis-empty || echo "  ✓ correctly refused empty target"
          # Run on the install.sh-created target
          bash lite/uninstall.sh /tmp/trellis-ci-target
          test ! -d /tmp/trellis-ci-target/.trellis-lite
          test ! -f /tmp/trellis-ci-target/AGENTS.md
          echo "uninstall.sh: OK"

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s lite/tests -t . -v 2>&1

      - name: Measure coverage (informational — subprocess tests are not tracked)
        run: |
          python3 -m pip install --quiet coverage
          # Note: most tests spawn the CLI as a subprocess for isolation,
          # which coverage cannot follow. The number below reflects only the
          # in-process portions (slugify fuzz, module-level constants). To
          # raise it, refactor tests to call cmd_* functions directly.
          python3 -m coverage run --include="lite/.trellis-lite/scripts/trellis.py" \
            -m unittest discover -s lite/tests -t . 2>&1
          python3 -m coverage report --include="lite/.trellis-lite/scripts/trellis.py" || true
